<body id="kt_body" class="page-loading">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!--begin::Theme mode setup on page load-->
  <script>
    // Apply the stored mode BEFORE first paint. This previously hardcoded 'light', which meant a
    // dark-mode user got a full white flash (splash screen included) on every reload until React
    // mounted and ColorModeProvider corrected it.
    // Keep the storage key in sync with app/theme/ColorMode.tsx (STORAGE_KEY).
    (function () {
      var mode = 'light'
      try {
        var stored = localStorage.getItem('wt-mui-color-mode')
        if (stored === 'dark' || stored === 'light') mode = stored
      } catch (e) { /* private mode */ }
      var root = document.documentElement
      root.setAttribute('data-bs-theme', mode)
      root.setAttribute('data-theme', mode)
      root.style.colorScheme = mode
      if (mode === 'dark') {
        root.classList.add('dark')
        // The one place the canvas colour is duplicated outside app/theme/githubDark.ts — this
        // runs before any module loads, so it cannot import GH_DARK.canvas. Keep them equal.
        root.style.setProperty('--gh-canvas', '#0d1117')
        root.style.backgroundColor = '#0d1117'
      }
    })()
  </script>
  <!--end::Theme mode setup on page load-->

  <div id="root"></div>

  <!--begin::Loading markup-->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-orb splash-orb--1"></div>
    <div class="splash-orb splash-orb--2"></div>
    <div class="splash-inner">
      <!-- The WiseTech lockup, served by this app (no S3 round-trip before the app can paint). -->
      <div class="splash-logo-wrap">
        <img src="%BASE_URL%media/brand/wisetech-logo.png" class="splash-logo" alt="WiseTech MEP Consultants" />
      </div>
      <div class="splash-loader" role="progressbar" aria-label="Loading"></div>
      <div class="loading-text">Preparing your workspace…</div>
    </div>
  </div>
  <!--
    Starts the splash before first paint (and again from utils/splashGate.showSplashAgain() after signing in).

    First open in a browser tab: the full intro, played start to finish exactly once (like a game's start screen).
    Later loads in that tab — reloads, signing in — skip it and show only a slim progress bar along the top
    (.splash--bar). sessionStorage remembers it per tab: a new tab or a reopened browser plays the intro again.
    utils/splashGate lifts either once the intro has finished (`data-intro-done`) and the app is ready.

    The intro: the organization's branding, remembered by the app (src/utils/splashBrand.ts) — keep the keys in sync.
    Only http(s) URLs are used; anything else keeps the default.
    Logo: swapped into the tile; the bar fills over INTRO_MS.
    Video: the organization's splash video, played through ONCE. It fades in over the logo when its first frame plays;
    when its shape doesn't match the screen it is scaled to fit and shown whole, the rest filled from its own edges.
    One that hasn't started by the end of the logo intro (slow network) is dropped and the logo intro completes; a
    failed one falls back to the logo. Skipped for reduced-motion and Data Saver users, who keep the logo.
  -->
  <script>
    (function () {
      var ok = function (v) { return !!v && /^https?:\/\/[^\s"'<>]+$/i.test(v) }
      var get = function (k) { try { return localStorage.getItem(k) } catch (e) { return null } }
      var SEEN_KEY = 'wt-splash-seen'
      var INTRO_MS = 2400
      var VIDEO_MAX_MS = 15000 // a longer (or stalled) video ends the intro here
      var run = 0
      var seen = function () { try { return sessionStorage.getItem(SEEN_KEY) === '1' } catch (e) { return false } }
      var afterPaint = function (fn) { requestAnimationFrame(function () { requestAnimationFrame(fn) }) }

      window.wtSplashStart = function () {
        var splash = document.getElementById('splash-screen')
        if (!splash) return
        var myRun = ++run
        // splashGate adds .splash--finishing when it runs the bar to 100%; nothing may pull it back after that.
        var live = function () { return myRun === run && !splash.classList.contains('splash--finishing') }
        var progress = function (pct, ms) {
          splash.style.setProperty('--splash-progress-ms', ms + 'ms')
          splash.style.setProperty('--splash-progress', pct + '%')
        }
        var introDone = function () {
          if (myRun !== run || splash.hasAttribute('data-intro-done')) return
          splash.setAttribute('data-intro-done', '')
          try { sessionStorage.setItem(SEEN_KEY, '1') } catch (e) {}
          splash.dispatchEvent(new Event('splash-intro-done'))
        }
        splash.removeAttribute('data-intro-done')
        progress(0, 0)

        if (seen()) {
          splash.classList.add('splash--bar')
          introDone()
          afterPaint(function () { if (live()) progress(70, 1500) })
          setTimeout(function () { if (live()) progress(92, 8000) }, 1600)
          return
        }
        splash.classList.remove('splash--bar')

        // The bar reaches 90% as the intro ends, creeps while the app finishes, and splashGate completes it.
        var finish = function () {
          introDone()
          if (live()) progress(96, 4000)
        }
        afterPaint(function () { if (live()) progress(90, INTRO_MS) })

        var logo = get('wt-splash-logo')
        if (ok(logo)) {
          var imgs = splash.querySelectorAll('.splash-logo')
          for (var i = 0; i < imgs.length; i++) {
            imgs[i].src = logo
            imgs[i].alt = 'Organization logo'
          }
        }

        var dropVideo = null
        var introTimer = setTimeout(function () {
          if (splash.classList.contains('splash--video')) return // the video is playing; its end ends the intro
          if (dropVideo) dropVideo()
          finish()
        }, INTRO_MS)

        try {
          var src = get('wt-splash-video-desktop')
          if (!ok(src)) return
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          if (navigator.connection && navigator.connection.saveData) return

          var video = document.createElement('video')
          video.className = 'splash-video'
          // Muted + inline are what let every browser (iOS Safari included) autoplay without a tap.
          video.muted = true
          video.defaultMuted = true
          video.setAttribute('muted', '')
          video.setAttribute('playsinline', '')
          video.setAttribute('aria-hidden', 'true')
          video.playsInline = true
          video.autoplay = true
          video.preload = 'auto'
          // The fill around a whole-shown video: one frame's outermost rows painted into a tiny canvas that CSS
          // stretches — not a second <video>, which decoded the whole file twice. (A cross-origin frame taints the
          // canvas; it can still be SHOWN, which is all this does.)
          var backdrop = document.createElement('canvas')
          backdrop.className = 'splash-video-backdrop'
          backdrop.setAttribute('aria-hidden', 'true')
          var paintBackdrop = function (barsY) {
            try {
              var w = video.videoWidth, h = video.videoHeight, ctx = backdrop.getContext('2d')
              backdrop.width = barsY ? 16 : 2
              backdrop.height = barsY ? 2 : 16
              if (barsY) {
                ctx.drawImage(video, 0, 0, w, 2, 0, 0, 16, 1)
                ctx.drawImage(video, 0, h - 2, w, 2, 0, 1, 16, 1)
              } else {
                ctx.drawImage(video, 0, 0, 2, h, 0, 0, 1, 16)
                ctx.drawImage(video, w - 2, 0, 2, h, 1, 0, 1, 16)
              }
            } catch (e) {}
          }

          // Fill the screen only when that crops almost nothing; otherwise show the WHOLE video (a logo or text in it
          // is never cut) over the fill. Decided from the real sizes, on every resize.
          var MAX_CROP = 0.06 // share of the video that may be cut off to fill the screen edge-to-edge
          var fit = function () {
            if (!video.isConnected || !video.videoWidth) return
            var vr = video.videoWidth / video.videoHeight
            var sr = window.innerWidth / window.innerHeight
            var mismatch = Math.min(vr, sr) / Math.max(vr, sr) < 1 - MAX_CROP
            var barsY = vr > sr // video wider than the screen: fit to width, fill above and below
            splash.classList.toggle('splash--letterbox', mismatch)
            splash.classList.toggle('splash--bars-y', mismatch && barsY)
            splash.classList.toggle('splash--bars-x', mismatch && !barsY)
            if (mismatch) paintBackdrop(barsY)
          }
          video.addEventListener('loadedmetadata', fit)
          var queued = false
          var onResize = function () {
            if (queued) return
            queued = true
            requestAnimationFrame(function () {
              queued = false
              if (!video.isConnected) { window.removeEventListener('resize', onResize); return } // splash gone
              fit()
            })
          }
          window.addEventListener('resize', onResize)

          dropVideo = function () {
            splash.classList.remove('splash--video', 'splash--has-video', 'splash--letterbox', 'splash--bars-y', 'splash--bars-x')
            video.pause()
            if (video.parentNode) video.parentNode.removeChild(video)
            if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop)
          }
          var started = false
          video.addEventListener('playing', function () {
            if (started || myRun !== run) return // a resume after buffering, not the first frame
            started = true
            clearTimeout(introTimer)
            splash.classList.add('splash--video')
            fit() // paints the fill from a real frame (metadata alone has none)
            setTimeout(finish, VIDEO_MAX_MS)
          })
          video.addEventListener('ended', finish)
          video.addEventListener('error', function () {
            dropVideo()
            if (started) finish() // otherwise the logo intro is still running and ends itself
          })
          splash.classList.add('splash--has-video')
          video.src = src
          splash.insertBefore(video, splash.firstChild)
          splash.insertBefore(backdrop, video)
          var p = video.play && video.play()
          if (p && p.catch) p.catch(function () {})
        } catch (e) {}
      }
      window.wtSplashStart()
    })()
  </script>
  <!--end::Loading markup-->

  <div id="root-modals"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
