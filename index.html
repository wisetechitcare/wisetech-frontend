<body id="kt_body" class="page-loading">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!--begin::Theme mode setup on page load-->
  <script>
    // Apply the stored mode BEFORE first paint. This previously hardcoded 'light', which meant a
    // dark-mode user got a full white flash (splash screen included) on every reload until React
    // mounted and ColorModeProvider corrected it.
    // Keep the storage key in sync with app/theme/ColorMode.tsx (STORAGE_KEY).
    (function () {
      var mode = 'light'
      try {
        var stored = localStorage.getItem('wt-mui-color-mode')
        if (stored === 'dark' || stored === 'light') mode = stored
      } catch (e) { /* private mode */ }
      var root = document.documentElement
      root.setAttribute('data-bs-theme', mode)
      root.setAttribute('data-theme', mode)
      root.style.colorScheme = mode
      if (mode === 'dark') {
        root.classList.add('dark')
        // The one place the canvas colour is duplicated outside app/theme/githubDark.ts — this
        // runs before any module loads, so it cannot import GH_DARK.canvas. Keep them equal.
        root.style.setProperty('--gh-canvas', '#0d1117')
        root.style.backgroundColor = '#0d1117'
      }
    })()
  </script>
  <!--end::Theme mode setup on page load-->

  <div id="root"></div>

  <!--begin::Loading markup-->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-orb splash-orb--1"></div>
    <div class="splash-orb splash-orb--2"></div>

          class="light-logo splash-logo" alt="Wisetech MEP light logo" />

      <div class="splash-loader" role="progressbar" aria-label="Loading"></div>
      <div class="loading-text">Preparing your workspace…</div>
    </div>
  </div>
  <!--end::Loading markup-->
