<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>WiseTech HR — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.card{width:min(440px,100%);padding:36px;text-align:center;background:#fff;border:1px solid #dbe3ef;border-radius:24px;box-shadow:0 18px 50px rgba(30,58,138,.12)}img{width:76px;height:76px;object-fit:contain}h1{margin:22px 0 10px;font-size:26px}p{margin:0;color:#64748b;line-height:1.6}.notice{margin:22px 0;padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:14px}button{min-height:44px;padding:0 24px;border:0;border-radius:12px;background:linear-gradient(135deg,#1e3a8a,#172554);color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/pwa-192.png" alt="WiseTech HR" />
    <h1>You’re offline</h1>
    <p>Reconnect to continue using WiseTech HR.</p>
    <div class="notice">Attendance and other changes require an internet connection and are never queued offline.</div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
