name: ✅ Frontend CI

# The gate that actually holds. Every check here also runs locally in .husky/, but a
# local hook is advisory — `--no-verify` skips all of them — so CI repeats the important
# ones. Wire the jobs below as REQUIRED status checks in Settings → Branches → main,
# alongside "Require a pull request before merging".
#
# THREE PARALLEL JOBS, not one long one. Steps inside a job run one after another, so a
# single job cost the SUM of every check (~5 min). Split, the run costs the slowest job:
#   checks     scan, lint, tests, audit       — the cheap gates
#   typecheck  tsc --noEmit                    — push runs only (see below)
#   build      tsc + vite build + preview      — pull requests only
# Each job installs on its own; the pnpm store cache makes that the price of parallelism.
#
# Lint note: the project has pre-existing ESLint errors in legacy files, so a whole-repo
# lint gate would block every merge. We hard-gate on the typecheck and lint ONLY the files
# a change touches, so new errors block while legacy ones don't.
#
# Bundling happens on PULL REQUESTS ONLY. On a push, Amplify builds the artifact that
# ships (see amplify.yml at the repo root — Amplify only reads it from there), so bundling
# here too would be a second bundle nothing consumes. On a PR there is no Amplify build at
# all — and `main` is the only branch that reaches production, so the PR into it is the
# last gate before users see the code.
#
# Runs on `dev` too. `dev` is the integration branch — every feature merges there first,
# so that is where a break should surface, not when the release PR is opened days later.
# A dev run CANNOT deploy: Amplify is connected to `main` only, and nothing in this
# workflow talks to Amplify — the two react to the same push independently.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

# Least privilege: these jobs only read the repo. Without this block they would inherit
# whatever the repo default is, which on older repos is read/write.
permissions:
  contents: read

# A newer push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Cheap gates: anything that needs the diff, plus tests and the audit ──────────────
  checks:
    name: Checks (scan, lint, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the diff base exists, but WITHOUT file contents (blob:none):
          # `git diff --name-only` needs commits and trees only, so this is a fraction of
          # a full clone. Only this job diffs; the other two take the default shallow clone.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false # don't leave the token in .git/config for later steps

      - uses: ./.github/actions/setup

      - name: 🎯 Resolve diff base
        id: base
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # `before` is all-zeros on a branch's first push; fall back to the parent commit.
          case "$base" in ''|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1) ;; esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: 🧷 Guard self-test
        run: pnpm run hooks:test

      # Same scanner the pre-commit hook runs (secrets, conflict markers, debugger,
      # .only, oversized files) — re-run here because the hook is bypassable.
      - name: 🔐 Secret and hygiene scan
        run: |
          files=$(git diff --name-only --diff-filter=ACM ${{ steps.base.outputs.sha }} HEAD)
          if [ -z "$files" ]; then echo "No changed files."; else echo "$files" | xargs node scripts/hooks/guard.mjs; fi

      - name: 🧹 Lint changed files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR ${{ steps.base.outputs.sha }} HEAD -- '*.ts' '*.tsx' | grep -v '^src/_metronic/' || true)
          if [ -z "$files" ]; then echo "No .ts/.tsx changes to lint."; else
            echo "Linting:"; echo "$files"
            echo "$files" | xargs pnpm exec eslint --quiet
          fi

      - name: 🧪 Run tests
        run: pnpm run test

      # taskDomain.test.ts is written against node:test rather than vitest, so it is
      # excluded in vitest.config.ts and runs here through its own esbuild + node --test
      # script. Two runners is not ideal, but the alternative was rewriting 45 passing
      # assertions to change nothing about what they check.
      - name: 🧩 Run task-domain tests
        run: pnpm run test:tasks

      # Blocks on high/critical only; moderate and low are reported without blocking a
      # merge. When a fix isn't published yet, pin the floor in pnpm-workspace.yaml
      # `overrides` rather than deleting this step. A registry we can't reach is not a
      # vulnerability — only an actual advisory fails this step. Mirrors the backend gate.
      - name: 🛡️ Audit dependencies
        run: |
          if out=$(pnpm audit --audit-level high 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          grep -qE 'TimeoutError|aborted due to timeout|ERR_PNPM_(AUDIT|FETCH)|ENOTFOUND|ECONNRESET|socket hang up' <<<"$out" \
            || exit 1
          echo "::warning::Advisory registry unreachable — dependency audit skipped."

  # ── Typecheck: PUSH runs only ─────────────────────────────────────────────────────────
  # On a pull request the build job runs `pnpm run build`, which is `tsc && vite build` —
  # the same typecheck. Running it here as well made PRs pay for 1,900 files twice.
  typecheck:
    name: Typecheck
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 🔎 Typecheck
        run: pnpm exec tsc --noEmit

  # ── Build: PULL REQUESTS only — proves the bundle before it can reach main ───────────
  #
  # `tsc --noEmit` is an identical gate for TYPE errors, but not for bundling ones. Rollup
  # resolves imports, assets and dynamic `import()` paths that tsc never looks at, so a
  # build can fail with a perfectly clean typecheck. On a push that failure would surface
  # in the Amplify build — AFTER the merge, in the deploy itself. This is the only bundle
  # that exists before production; the artifact is not the point, the proof that it builds is.
  #
  # Deliberately `pnpm run build`, the same command amplify.yml runs, rather than
  # `vite build` alone. Reproducing the deploy command is the whole purpose.
  build:
    name: Build + preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The Vite build needs a 4 GB heap and is the slowest job; 25 matches the backend.
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: 🏗️ Build (typecheck + bundle)
        run: pnpm run build

      # --retry-connrefused: vite preview needs a moment to bind, and plain --retry does not
      # retry a refused connection, so the first probe failed at once ("after 0 ms"). vite is
      # called directly: `pnpm run preview -- --host` forwards a literal "--" (pnpm 11) and the
      # host flag never reached vite, so it bound localhost instead of 127.0.0.1.
      - name: 🌐 Preview employee-create route
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:4173/employees/create-new | grep -q '<div id="root">'
