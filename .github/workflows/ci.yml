name: ✅ Frontend CI

# The gate that actually holds. Every check here also runs locally in .husky/, but a
# local hook is advisory — `--no-verify` skips all of them — so CI repeats the important
# ones. Steps are ordered cheapest-first: a leaked key fails in ~40s, not after the build.
# Wire this as a REQUIRED status check in Settings → Branches → main, alongside
# "Require a pull request before merging".
#
# Lint note: the project has pre-existing ESLint errors in legacy files, so a whole-repo
# lint gate would block every merge. We hard-gate on the typecheck and lint ONLY the files
# a change touches, so new errors block while legacy ones don't.
#
# This job bundles on PULL REQUESTS ONLY. On a push, Amplify builds the artifact that
# ships (see amplify.yml), so bundling here too would be a second bundle nothing
# consumes. On a PR there is no Amplify build at all — and `main` is the only branch
# that reaches production, so the PR into it is the last gate before users see the code.
#
# Runs on `dev` too. `dev` is the integration branch — every feature merges there first,
# so that is where a break should surface, not when the release PR is opened days later.
# A dev run CANNOT deploy: Amplify is connected to `main` only, and nothing in this
# workflow talks to Amplify — the two react to the same push independently.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

# Least privilege: this job only reads the repo. Without this block the job would
# inherit whatever the repo default is, which on older repos is read/write.
permissions:
  contents: read

# A newer push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 25 to match the backend: a PR run now bundles, and the Vite build needs a 4 GB heap.
    # Push runs (main/dev) skip the bundle and finish well inside this.
    timeout-minutes: 25

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the base commit
          persist-credentials: false # don't leave the token in .git/config for later steps

      # Must come before setup-node: `cache: pnpm` needs pnpm on PATH.
      # Version is read from the "packageManager" field in package.json.
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 24, not 20: pnpm 11.20 (our packageManager) requires Node >= 22.13 and dies on
          # 20 with "No such built-in module: node:sqlite" before it can install anything.
          # GitHub is also deprecating Node 20 on runners. Vite 7's floor is 20.19, so 24
          # satisfies both.
          node-version: 24
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎯 Resolve diff base
        id: base
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # `before` is all-zeros on a branch's first push; fall back to the parent commit.
          case "$base" in ''|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1) ;; esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: 🧷 Guard self-test
        run: pnpm run hooks:test

      # Same scanner the pre-commit hook runs (secrets, conflict markers, debugger,
      # .only, oversized files) — re-run here because the hook is bypassable.
      - name: 🔐 Secret and hygiene scan
        run: |
          files=$(git diff --name-only --diff-filter=ACM ${{ steps.base.outputs.sha }} HEAD)
          if [ -z "$files" ]; then echo "No changed files."; else echo "$files" | xargs node scripts/hooks/guard.mjs; fi

      - name: 🧹 Lint changed files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR ${{ steps.base.outputs.sha }} HEAD -- '*.ts' '*.tsx' | grep -v '^src/_metronic/' || true)
          if [ -z "$files" ]; then echo "No .ts/.tsx changes to lint."; else
            echo "Linting:"; echo "$files"
            echo "$files" | xargs pnpm exec eslint --quiet
          fi

      # This repo had 30 test files and a configured vitest, and CI ran none of them.
      # Placed before the build deliberately: the suite finishes in about 25s and the
      # bundle takes minutes, so a broken test should not wait on a webpack-sized build
      # to be reported.
      - name: 🧪 Run tests
        run: pnpm run test

      # taskDomain.test.ts is written against node:test rather than vitest, so it is
      # excluded in vitest.config.ts and runs here through its own esbuild + node --test
      # script. Two runners is not ideal, but the alternative was rewriting 45 passing
      # assertions to change nothing about what they check.
      - name: 🧩 Run task-domain tests
        run: pnpm run test:tasks

      # Runs on every trigger: it is the hard gate and it is far cheaper than a bundle.
      - name: 🔎 Typecheck
        run: pnpm exec tsc --noEmit

      # BUNDLE ON PULL REQUESTS ONLY.
      #
      # `--noEmit` above is an identical gate for TYPE errors, but not for bundling
      # ones. Rollup resolves imports, assets and dynamic `import()` paths that tsc
      # never looks at, so a build can fail with a perfectly clean typecheck.
      #
      # On a push that failure surfaces in the Amplify build — which happens AFTER the
      # merge, on `main`, i.e. in the deploy itself. Amplify is not gated on this
      # workflow; the two react to the same push independently. So a bad bundle cannot
      # be caught by anything before it is already on the production branch.
      #
      # On a PR there is no Amplify build to consume a dist, which is exactly why the
      # earlier "second bundle nothing consumes" reasoning does not apply here: this is
      # the only bundle that exists before production. The artifact is not the point —
      # the proof that it builds is.
      #
      # Deliberately `pnpm run build`, the same command amplify.yml runs, rather than
      # `vite build` alone. Reproducing the deploy command is the whole purpose; saving
      # the duplicated tsc would reintroduce the drift amplify.yml exists to prevent.
      - name: 🏗️ Build (PR only — proves the bundle before it can reach main)
        if: github.event_name == 'pull_request'
        run: pnpm run build

      # Mirrors the backend gate. Blocks on high/critical only; moderate and low are
      # reported without blocking a merge. When a fix isn't published yet, pin the floor
      # in pnpm-workspace.yaml `overrides` rather than deleting this step.
      # A registry we can't reach is not a vulnerability — only an actual advisory
      # fails this step. Mirrors the backend gate.
      - name: 🛡️ Audit dependencies
        run: |
          if out=$(pnpm audit --audit-level high 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          grep -qE 'TimeoutError|aborted due to timeout|ERR_PNPM_(AUDIT|FETCH)|ENOTFOUND|ECONNRESET|socket hang up' <<<"$out" \
            || exit 1
          echo "::warning::Advisory registry unreachable — dependency audit skipped."
